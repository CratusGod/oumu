[package]
name = "oumu"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Oumu: a local-first writing assistant (Rust + Rune, Windows)"

[lib]
name = "oumu_lib"
path = "src/lib.rs"

[[bin]]
name = "oumu"
path = "src/main.rs"

[dependencies]
tauri = { package = "oumu-rt", path = "../oumu-rt" }
shared.workspace = true
rune.workspace = true
rune-kit.workspace = true
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { workspace = true }
anyhow = "1"
harper-core = "2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
arboard = "3"
tiny_http = "0.12"
dirs = "5"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
scraper = "0.21"
unicode-segmentation = "1"
url = "2"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
install = { path = "../install" }
windows62 = { package = "windows", version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
